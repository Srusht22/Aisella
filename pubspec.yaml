name: aisellia
description: "Aisellia — Your AI Sales Employee. Mobile app for online sellers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

# Dependencies are intentionally minimal for the Phase 4 foundation.
# Backend, crash reporting and model packages arrive with the phases that use them
# (see docs/architecture/phase-3/technology-decisions.md §3).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3 # state + DI (ADR-006)
  flutter_secure_storage: 11.2.0
  go_router: 18.1.0 # routing, per-tab stacks (ADR-006)
  image: 4.12.0 # product photos: orient, crop 1:1, resize, re-encode without metadata (BR-71)
  image_picker: 1.2.4 # product photos from camera or gallery (Phase 1 Journey B)
  intl: any # version pinned by flutter_localizations
  shared_preferences: 2.5.6 # device-local UI preferences (language before sign-in)
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: VazirmatnNL
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-NL-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-NL-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-NL-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-NL-Bold.ttf
          weight: 700
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-subset.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill-subset.ttf

  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/vazirmatn/OFL.txt
    - assets/fonts/phosphor/LICENSE.txt
