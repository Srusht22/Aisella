<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aisellia — your AI sales employee.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aisellia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aisellia</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121417">
  <!-- Loading screen shown at once while the app starts; removed on the
       app's first frame. Matches the app's canvas in light and dark. -->
  <style>
    :root { --bg: #F6F4EF; --fg: #1A1C20; --muted: #555A63; --brand: #1F3F8F; --ink: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121417; --fg: #ECEDEF; --muted: #A9AEB8; --brand: #9DB4F2; --ink: #0F1B3D; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 30% 20%,
        color-mix(in srgb, var(--brand) 18%, transparent), transparent 60%),
        var(--bg);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 300ms ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 72px; height: 72px; border-radius: 20px; background: var(--brand);
      display: grid; place-items: center;
      box-shadow: 0 12px 32px color-mix(in srgb, var(--brand) 40%, transparent);
      animation: pop 600ms cubic-bezier(.34,1.56,.64,1) both;
    }
    #splash .name { color: var(--fg); font-size: 26px; font-weight: 700;
      letter-spacing: .2px; animation: rise 500ms 150ms ease-out both; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; overflow: hidden;
      background: color-mix(in srgb, var(--muted) 25%, transparent);
      animation: rise 500ms 250ms ease-out both; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 4px; background: var(--brand);
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Aisellia is loading" role="status">
    <div class="mark">
      <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M28 77L50 25L72 77" fill="none" stroke="var(--ink)" stroke-width="11"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 52.5Q51.9 59.1 58.5 61Q51.9 62.9 50 69.5Q48.1 62.9 41.5 61Q48.1 59.1 50 52.5Z"
              fill="var(--ink)"/>
        <path d="M73 19.5Q74.2 23.8 78.5 25Q74.2 26.2 73 30.5Q71.8 26.2 67.5 25Q71.8 23.8 73 19.5Z"
              fill="var(--ink)"/>
      </svg>
    </div>
    <div class="name">Aisellia</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
